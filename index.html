<!DOCTYPE html>
<html lang="ja">
  <head>
    <style>
      #stage {
        width: 360px;
        max-width: 100%;
        height: 250px;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
        border: 8px solid #5c3b2e;
        background: #f7f0e4;
        position: relative;
        touch-action: none;
      }
      .block {
        position: absolute;
        width: 48px;
        height: 48px;
        background: #c45c26;
        left: 0;
        bottom: 0;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>どうぶつタワー</title>
  </head>
  <body>
    <!-- ゲームの説明 
    <h1>どうぶつタワー</h1>
    <p>ブラウザで開いたページです。ここからゲームを作っていきます。</p>
    -->
    <button type="button" id="rotate">回す</button>
    <p id="message"></p>
    <div id="stage"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
    <script>
      const stage = document.querySelector("#stage");
      const blocks = [];
      const blockSize = 48;
      const fallStep = 8;
      const fallInterval = 20;

      let current = null;
      let dragging = false;

      function addBlock(x, y) {
        const block = document.createElement("div");
        block.className = "block";
        block.style.left = x + "px";
        block.style.bottom = y + "px";
        stage.appendChild(block);
        return block;
      }

      function resetBlocks() {
        blocks.length = 0;

        const placed = stage.querySelectorAll(".block");
        for (const block of placed) {
          block.remove();
        }
        current = null;
        prepareNext();
      }

      function prepareNext() {
        const y = stage.clientHeight - blockSize;
        current = addBlock(0, y);
      }

      function moveCurrent(event) {
        const rect = stage.getBoundingClientRect();
        let x = event.clientX - rect.left - blockSize / 2;
        const maxX = stage.clientWidth - blockSize;

        if (x < 0) {
          x = 0;
        }
        if (x > maxX) {
          x = maxX;
        }
        current.style.left = x + "px";
      }

      function landY(x){
        let y = 0;

        for (const block of blocks) {
          const overlaps = x < block.x + blockSize && x + blockSize > block.x;
          if (overlaps && block.y +blockSize > y) {
            y = block.y + blockSize;
          }
        }
        return y;
      }

      function fall(block, x){
        const goal = landY(x);
        const timer = setInterval(function () {
          let y = parseInt(block.style.bottom, 10);
          y = y - fallStep;

          if(y <= goal){
            y = goal;
            block.style.bottom = y + "px";
            clearInterval(timer);
            blocks.push({ x: x, y: y });
            const nextY = stage.clientHeight - blockSize;
            if (y + blockSize > nextY) {
              alert("枠がいっぱいになりました")
              resetBlocks();
            } else {
              prepareNext();
            }
          } else {
            block.style.bottom = y + "px";
          }
        }, fallInterval);
      }

      let dropped = false;
      let box = null;
      let block = null;
      let releaseBody = null;
      let fallingStarted = false;
      let lost = false;
      const pieces = [];
      const shapes = [
        { width: 48, height: 48 },
        { width: 84, height: 36 },
        { width: 36, height: 72 }
      ];
      let shapeIndex = 0;

      function bodySize(){
        return {
          width: box.bounds.max.x - box.bounds.min.x,
          height: box.bounds.max.y - box.bounds.min.y
        };
      }

      function moveBox(event) {
        const rect = stage.getBoundingClientRect();
        const size = bodySize();
        let x = event.clientX - rect.left;
        const minX = size.width / 2;
        const maxX = width - size.width / 2;

        if (x < minX) {
          x = minX;
        }
        if (x > maxX) {
          x = maxX;
        }
        Matter.Body.setPosition(box, { x: x, y: size.height / 2 });
      }

      function spawnPiece() {
        const shape = shapes[shapeIndex % shapes.length];
        shapeIndex++;

        box = Matter.Bodies.rectangle(width / 2, shape.height / 2, shape.width, shape.height);
        Matter.Body.setStatic(box, true);
        Matter.Composite.add(engine.world, box);
        block = addBlock(0, 0);
        block.style.width = shape.width + "px";
        block.style.height = shape.height + "px";
        pieces.push({ body: box, element: block, width: shape.width, height: shape.height });
        dropped = false;
      }

      function resetPieces() {
        for (const piece of pieces){
          Matter.Composite.remove(engine.world, piece.body);
          piece.element.remove();
        }
        pieces.length = 0;
        box = null;
        block = null;
        releaseBody = null;
        fallingStarted = false;
        dropped = false;
        dragging = false;
        spawnPiece();
      }

      function pieceIsOut(body){
        return body.position.x < 0 || body.position.x > width || body.position.y > height;
      }

      function lose() {
        if (lost){
          return;
        }
        lost = true;
        releaseBody = null;
        dropped = true;
        box = null;
        document.querySelector("#message").textContent = "あなたの負けです";
        Matter.Runner.stop(runner);
      }

      document.querySelector("#rotate").addEventListener("click", function () {
        if (lost) {
          return;
        }
        if(!box || dropped) {
          return;
        }

        Matter.Body.setAngle(box, box.angle + Math.PI / 2);
        const size = bodySize();
        Matter.Body.setPosition(box, { x: box.position.x, y: size.height / 2 });
      });
      

      stage.addEventListener("pointerdown", function (event) {
        if (lost) {
          return;
        }
        if(dropped) {
          return;
        }
        dragging = true;
        moveBox(event);
      });

      window.addEventListener("pointermove", function (event) {
        if (lost) {
           return;
        }
        if (!dragging || dropped) {
          return;
        }
        moveBox(event);
      });

      window.addEventListener("pointerup", function () {
        if (lost) {
          return;
        }
        if (!dragging || dropped) {
          return;
        }
        dragging = false;
        dropped = true;
        fallingStarted = false;
        releaseBody = box;
        Matter.Body.setStatic(box, false);
        box = null;
        });

      const width = stage.clientWidth;
      const height = stage.clientHeight;
      const engine = Matter.Engine.create();
      const ground = Matter.Bodies.rectangle(width / 2, height + 10, width, 20, {
        isStatic: true
      });
      Matter.Composite.add(engine.world, ground);

      Matter.Events.on(engine, "afterUpdate", function () {
        for (const piece of pieces) {
          piece.element.style.left = (piece.body.position.x - piece.width / 2) + "px";
          piece.element.style.bottom = (height - (piece.body.position.y + piece.height / 2)) + "px";
          piece.element.style.transform = "rotate(" + piece.body.angle + "rad)";
        }
        if (!lost) {
          for (const piece of pieces){
            if (pieceIsOut(piece.body)) {
              lose();
              break;
            }
          }
        }
        if (!lost && releaseBody) {
          if (releaseBody.speed > 0.4) {
            fallingStarted = true;
          }
          const stopped = fallingStarted && releaseBody.speed < 0.15;
          const clearedTop = releaseBody.bounds.min.y > 72;

          if (clearedTop) {
            releaseBody = null;
            fallingStarted = false;
            spawnPiece();
          } else if (stopped) {
            releaseBody = null;
            fallingStarted = false;
            alert("枠がいっぱいになりました");
            resetPieces();
          }
        }
      });
      const runner = Matter.Runner.create();
      Matter.Runner.run(runner, engine);
      spawnPiece();

    </script>
  </body>
</html>
